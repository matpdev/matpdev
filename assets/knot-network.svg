<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Bridges UCA Knot Network Topology">
  <defs>
    <linearGradient id="knBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0F"/>
      <stop offset="100%" stop-color="#0D1219"/>
    </linearGradient>
    <pattern id="knGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#15202B" stroke-width="0.6"/>
    </pattern>
  </defs>

  <polygon points="14,4 886,4 896,14 896,206 886,216 14,216 4,206 4,14" fill="url(#knBg)" stroke="#1E2D3D" stroke-width="1.3"/>
  <polygon points="14,4 886,4 896,14 896,206 886,216 14,216 4,206 4,14" fill="url(#knGrid)" opacity="0.55"/>

  <!-- Top/Bottom Corner Accents -->
  <polyline points="4,24 4,14 14,4 32,4" fill="none" stroke="#00D8FF" stroke-width="2"/>
  <polyline points="868,4 886,4 896,14 896,24" fill="none" stroke="#00D8FF" stroke-width="2"/>
  <polyline points="4,196 4,206 14,216 32,216" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <polyline points="868,216 886,216 896,206 896,196" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Chiral Bridge Links -->
  <line x1="205" y1="108" x2="245" y2="108" stroke="#1E2D3D" stroke-width="2"/>
  <line x1="205" y1="108" x2="245" y2="108" stroke="#00D8FF" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <line x1="425" y1="108" x2="465" y2="108" stroke="#1E2D3D" stroke-width="2"/>
  <line x1="425" y1="108" x2="465" y2="108" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <line x1="655" y1="108" x2="695" y2="108" stroke="#1E2D3D" stroke-width="2"/>
  <line x1="655" y1="108" x2="695" y2="108" stroke="#00D8FF" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- KNOT-01: HARDWARE -->
  <g transform="translate(24, 34)">
    <polygon points="8,0 173,0 181,8 181,142 173,150 8,150 0,142 0,8" fill="#0B1016" stroke="#D4AF37" stroke-width="1.4"/>
    <text x="14" y="24" fill="#D4AF37" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">KNOT-01 // SILICON</text>
    <line x1="14" y1="33" x2="167" y2="33" stroke="#1B2836" stroke-width="1"/>
    <text x="14" y="54" fill="#F0F6FC" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Hardware &amp; Embedded</text>
    <text x="14" y="78" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· STM32 / ESP32</text>
    <text x="14" y="96" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· MIPS R5900 Recomp</text>
    <text x="14" y="114" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· UART / Serial / WIM</text>
    <text x="14" y="136" fill="#00D8FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">BRIDGE: TCP/UDP · FFI</text>
  </g>

  <!-- KNOT-02: SYSTEMS & GPU -->
  <g transform="translate(245, 34)">
    <polygon points="8,0 172,0 180,8 180,142 172,150 8,150 0,142 0,8" fill="#0B1016" stroke="#00D8FF" stroke-width="1.4"/>
    <text x="14" y="24" fill="#00D8FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">KNOT-02 // CORE</text>
    <line x1="14" y1="33" x2="166" y2="33" stroke="#1B2836" stroke-width="1"/>
    <text x="14" y="54" fill="#F0F6FC" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Systems &amp; Graphics</text>
    <text x="14" y="78" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· C++23 / Rust / C</text>
    <text x="14" y="96" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· Vulkan 1.3 / OpenGL</text>
    <text x="14" y="114" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· Boost.ASIO / Qt6</text>
    <text x="14" y="136" fill="#D4AF37" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">BRIDGE: QUEUES · gRPC</text>
  </g>

  <!-- KNOT-03: CLOUD & DATA -->
  <g transform="translate(465, 34)">
    <polygon points="8,0 182,0 190,8 190,142 182,150 8,150 0,142 0,8" fill="#0B1016" stroke="#00D8FF" stroke-width="1.4"/>
    <text x="14" y="24" fill="#00D8FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">KNOT-03 // BACKBONE</text>
    <line x1="14" y1="33" x2="176" y2="33" stroke="#1B2836" stroke-width="1"/>
    <text x="14" y="54" fill="#F0F6FC" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Backend &amp; Cloud</text>
    <text x="14" y="78" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· Go / .NET 8 / FastAPI</text>
    <text x="14" y="96" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· AWS SQS · SNS · ECS</text>
    <text x="14" y="114" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· PostgreSQL / MongoDB</text>
    <text x="14" y="136" fill="#D4AF37" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">BRIDGE: APIs · SYNC</text>
  </g>

  <!-- KNOT-04: CLIENT & TOOLING -->
  <g transform="translate(695, 34)">
    <polygon points="8,0 173,0 181,8 181,142 173,150 8,150 0,142 0,8" fill="#0B1016" stroke="#D4AF37" stroke-width="1.4"/>
    <text x="14" y="24" fill="#D4AF37" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">KNOT-04 // EDGE</text>
    <line x1="14" y1="33" x2="167" y2="33" stroke="#1B2836" stroke-width="1"/>
    <text x="14" y="54" fill="#F0F6FC" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Client &amp; Dev Tooling</text>
    <text x="14" y="78" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· Flutter / SwiftUI</text>
    <text x="14" y="96" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· Kotlin / Next.js</text>
    <text x="14" y="114" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">· LSP / MCP / CLI</text>
    <text x="14" y="136" fill="#00D8FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">STATUS: 100% CONNECTED</text>
  </g>

  <!-- Bottom Network Footer -->
  <text x="24" y="204" fill="#6E7681" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.2">
    CHIRAL NETWORK COVERAGE: FULL-STACK SILICON-TO-CLOUD   //   PACKET LOSS: 0.00%
  </text>
</svg>
