    <text x="385" y="11" fill="#8B949E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">14%</text>
  </g>
  <g transform="translate(460, 182)">
    <text x="0" y="12" fill="#E6EDF3" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">TS / Dart / Swift</text>
    <rect x="135" y="3" width="240" height="8" rx="1" fill="#16202A"/>
    <rect x="135" y="3" width="35" height="8" rx="1" fill="#8B949E">
