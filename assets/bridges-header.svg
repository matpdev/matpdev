<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Bridges Chiral Network Terminal - Matheus Alves (@matpdev)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0E"/>
      <stop offset="55%" stop-color="#0C1219"/>
      <stop offset="100%" stop-color="#080B0F"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00D8FF" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D8FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#15202B" stroke-width="0.7"/>
    </pattern>
    <clipPath id="frameClip">
      <polygon points="18,6 882,6 894,18 894,242 882,254 18,254 6,242 6,18"/>
    </clipPath>
  </defs>

  <!-- Background, Grid & Timefall Rain -->
  <g clip-path="url(#frameClip)">
    <rect width="900" height="260" fill="url(#bgGrad)"/>
    <rect width="900" height="260" fill="url(#grid)" opacity="0.65"/>

    <!-- Subtle Timefall Streaks -->
    <g stroke="#00D8FF" stroke-width="0.7" opacity="0.16">
      <line x1="120" y1="-30" x2="105" y2="20">
        <animate attributeName="y1" values="-40;270" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="10;320" dur="2.1s" repeatCount="indefinite"/>
      </line>
      <line x1="280" y1="-60" x2="265" y2="-10">
        <animate attributeName="y1" values="-60;270" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-10;320" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <line x1="470" y1="-20" x2="455" y2="30">
        <animate attributeName="y1" values="-20;270" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="30;320" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <line x1="630" y1="-50" x2="615" y2="0">
        <animate attributeName="y1" values="-50;270" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;320" dur="1.9s" repeatCount="indefinite"/>
      </line>
      <line x1="810" y1="-35" x2="795" y2="15">
        <animate attributeName="y1" values="-35;270" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="15;320" dur="2.3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Subtle Chiral Strands in Background -->
    <g stroke="#D4AF37" stroke-width="0.6" opacity="0.15">
      <line x1="590" y1="6" x2="590" y2="92"/>
      <line x1="612" y1="6" x2="612" y2="68"/>
      <line x1="845" y1="6" x2="845" y2="115"/>
    </g>

    <!-- Vertical Scan Band -->
    <rect x="0" y="-60" width="900" height="60" fill="url(#scanGrad)">
      <animate attributeName="y" from="-60" to="270" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Chamfered Frame -->
  <polygon points="18,6 882,6 894,18 894,242 882,254 18,254 6,242 6,18"
           fill="none" stroke="#1E2D3D" stroke-width="1.5"/>

  <!-- Corner Brackets (Bridges Cyan & Chiral Gold) -->
  <polyline points="6,36 6,18 18,6 46,6" fill="none" stroke="#00D8FF" stroke-width="2.5"/>
  <polyline points="854,6 882,6 894,18 894,36" fill="none" stroke="#00D8FF" stroke-width="2.5"/>
  <polyline points="6,224 6,242 18,254 46,254" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <polyline points="854,254 882,254 894,242 894,224" fill="none" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- Top Telemetry Bar -->
  <line x1="24" y1="40" x2="876" y2="40" stroke="#1B2836" stroke-width="1"/>
  <text x="32" y="28" fill="#00D8FF" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">
    BRIDGES // UCA CHIRAL NETWORK TERMINAL
  </text>

  <!-- Status Indicator -->
  <g transform="translate(615, 24)">
    <circle cx="0" cy="0" r="4" fill="#00D8FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00D8FF" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.3">
      BB-28: <tspan fill="#00D8FF" font-weight="700">SYNCED</tspan>  //  CHIRAL LINK: <tspan fill="#D4AF37" font-weight="700">ONLINE</tspan>
    </text>
  </g>

  <!-- Left Content: Porter Identity -->
  <text x="34" y="74" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="2">
    PORTER ID: <tspan fill="#D4AF37" font-weight="700">@MATPDEV</tspan>   //   KNOT: <tspan fill="#E6EDF3">UCA-BR-NE</tspan>   //   GRADE: <tspan fill="#D4AF37">LEGEND OF LEGENDS</tspan>
  </text>

  <text x="32" y="122" fill="#F0F6FC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="1.5">
    MATHEUS ALVES
  </text>

  <text x="34" y="152" fill="#00D8FF" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="13.5" font-weight="600" letter-spacing="1.6">
    SYSTEMS &amp; BACKEND ENGINEER  ·  PRODUCT BUILDER
  </text>

  <text x="34" y="179" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11.5" letter-spacing="0.5">
    C++23 · Rust · Go · C# (.NET) · Vulkan · Embedded TCP/UDP · AWS
  </text>

  <!-- Bridges Order / Cargo Telemetry Strip -->
  <text x="34" y="200" fill="#6E7681" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.5" letter-spacing="1.2">
    CHIRAL DENSITY: <tspan fill="#00D8FF">42.08 kCg</tspan>   |   CARGO: <tspan fill="#D4AF37">100% INTACT</tspan>   |   TIMEFALL: <tspan fill="#E6EDF3">NOMINAL</tspan>
  </text>

  <!-- Bottom Chiralium Signal Bar -->
  <line x1="32" y1="212" x2="640" y2="212" stroke="url(#cyanLine)" stroke-width="1"/>
  <path d="M 32 229 L 110 229 L 122 221 L 134 237 L 146 225 L 158 229 L 320 229 L 332 219 L 344 238 L 356 223 L 368 229 L 620 229"
        fill="none" stroke="#00D8FF" stroke-width="1.4" stroke-dasharray="12 6" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <text x="34" y="246" fill="#6E7681" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.5" letter-spacing="1.5">
    "TOMORROW IS IN YOUR HANDS"   //   SIDEQUESTLAB.DEV
  </text>

  <!-- Right Emblem: Animated Odradek / Chiral Scanner -->
  <g transform="translate(770, 142)">
    <circle cx="0" cy="0" r="66" fill="none" stroke="#1E2D3D" stroke-width="1.2" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00D8FF" stroke-width="1.3" stroke-dasharray="22 10 4 10" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Odradek 5-Blade Silhouette -->
    <g stroke="#00D8FF" stroke-width="1.9" stroke-linecap="round" fill="none">
      <line x1="0" y1="-8" x2="0" y2="-38"/>
      <line x1="7" y1="-3" x2="34" y2="-19"/>
      <line x1="6" y1="6" x2="27" y2="27"/>
      <line x1="-6" y1="6" x2="-27" y2="27"/>
      <line x1="-7" y1="-3" x2="-34" y2="-19"/>
      <animateTransform attributeName="transform" type="rotate" values="-10 0 0;10 0 0;-10 0 0" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- Core Sensor -->
    <circle cx="0" cy="0" r="6" fill="#D4AF37">
      <animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
