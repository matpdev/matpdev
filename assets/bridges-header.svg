<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Bridges Chiral Network Terminal - Matheus Alves (@matpdev)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10"/>
      <stop offset="60%" stop-color="#0D1218"/>
      <stop offset="100%" stop-color="#080B0E"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00D8FF" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D8FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16202A" stroke-width="0.7"/>
    </pattern>
    <clipPath id="frameClip">
      <polygon points="18,6 882,6 894,18 894,232 882,244 18,244 6,232 6,18"/>
    </clipPath>
  </defs>

  <!-- Background & Tactical Grid -->
  <g clip-path="url(#frameClip)">
    <rect width="900" height="250" fill="url(#bgGrad)"/>
    <rect width="900" height="250" fill="url(#grid)" opacity="0.65"/>

    <!-- Subtle Vertical Scan Band -->
    <rect x="0" y="-60" width="900" height="60" fill="url(#scanGrad)">
      <animate attributeName="y" from="-60" to="260" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Chamfered Frame -->
  <polygon points="18,6 882,6 894,18 894,232 882,244 18,244 6,232 6,18"
           fill="none" stroke="#1E2D3D" stroke-width="1.5"/>

  <!-- Corner Brackets (Bridges Cyan & Chiral Gold) -->
  <polyline points="6,36 6,18 18,6 46,6" fill="none" stroke="#00D8FF" stroke-width="2.5"/>
  <polyline points="854,6 882,6 894,18 894,36" fill="none" stroke="#00D8FF" stroke-width="2.5"/>
  <polyline points="6,214 6,232 18,244 46,244" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <polyline points="854,244 882,244 894,232 894,214" fill="none" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- Top Telemetry Bar -->
  <line x1="24" y1="40" x2="876" y2="40" stroke="#1B2836" stroke-width="1"/>
  <text x="32" y="28" fill="#00D8FF" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">
    BRIDGES // CHIRAL NETWORK TERMINAL
  </text>

  <!-- Status Indicator -->
  <g transform="translate(650, 24)">
    <circle cx="0" cy="0" r="4" fill="#00D8FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00D8FF" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;10;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">
      CHIRAL LINK: <tspan fill="#D4AF37" font-weight="700">ONLINE</tspan>
    </text>
  </g>

  <!-- Left Content: Porter Identity -->
  <text x="34" y="76" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="2.2">
    PORTER ID: <tspan fill="#D4AF37">@MATPDEV</tspan>   //   UCA NODE: <tspan fill="#E6EDF3">BR-NE</tspan>
  </text>

  <text x="32" y="124" fill="#F0F6FC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="1.5">
    MATHEUS ALVES
  </text>

  <text x="34" y="154" fill="#00D8FF" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" letter-spacing="1.8">
    SYSTEMS &amp; BACKEND ENGINEER  ·  PRODUCT BUILDER
  </text>

  <text x="34" y="182" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11.5" letter-spacing="0.6">
    C++23 · Rust · Go · C# (.NET) · Vulkan · Embedded Protocols · AWS
  </text>

  <!-- Bottom Chiralium Signal Bar -->
  <line x1="32" y1="205" x2="640" y2="205" stroke="url(#cyanLine)" stroke-width="1"/>
  <path d="M 32 222 L 110 222 L 122 214 L 134 230 L 146 218 L 158 222 L 320 222 L 332 212 L 344 231 L 356 216 L 368 222 L 620 222"
        fill="none" stroke="#00D8FF" stroke-width="1.4" stroke-dasharray="12 6" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <text x="34" y="238" fill="#6E7681" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="9.5" letter-spacing="1.5">
    CARGO INTEGRITY: 100%   //   BANDWIDTH: HIGH-THROUGHPUT   //   SIDEQUESTLAB.DEV
  </text>

  <!-- Right Emblem: Animated Odradek / Chiral Scanner -->
  <g transform="translate(770, 136)">
    <!-- Outer Rotating Ring -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1E2D3D" stroke-width="1.2" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <!-- Middle Counter-Rotating Chiral Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00D8FF" stroke-width="1.3" stroke-dasharray="22 10 4 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Gold Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Odradek 5-Blade Silhouette -->
    <g stroke="#00D8FF" stroke-width="1.8" stroke-linecap="round" fill="none">
      <line x1="0" y1="-8" x2="0" y2="-36"/>
      <line x1="7" y1="-3" x2="32" y2="-18"/>
      <line x1="6" y1="6" x2="26" y2="26"/>
      <line x1="-6" y1="6" x2="-26" y2="26"/>
      <line x1="-7" y1="-3" x2="-32" y2="-18"/>
      <animateTransform attributeName="transform" type="rotate" values="-8 0 0;8 0 0;-8 0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Core Sensor -->
    <circle cx="0" cy="0" r="6" fill="#D4AF37">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
